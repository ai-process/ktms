# Release: `git tag vX.Y.Z && git push origin vX.Y.Z` runs .github/workflows/release.yml.
# macOS signing and the Homebrew tap switch on only when their secrets exist.
version: 2
project_name: ktms

builds:
  - id: node
    main: ./cmd/node-agent
    binary: ktms-node
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
  # The macOS tray needs cgo; release.yml builds it on a Mac (scripts/build-tray-app.sh).
  - id: tray
    main: ./cmd/node-tray
    binary: ktms-node-tray
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
  - id: server
    main: ./cmd/server
    binary: ktms-server
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
  - id: cli
    main: ./cmd/ktms
    binary: ktms
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - id: node
    ids: [node]
    formats: [tar.gz]
    name_template: "ktms-node_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, NOTICE]
  - id: tray
    ids: [tray]
    formats: [tar.gz]
    name_template: "ktms-node-tray_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, NOTICE]
  - id: server
    ids: [server]
    formats: [tar.gz]
    name_template: "ktms-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, NOTICE]
  - id: cli
    ids: [cli]
    formats: [tar.gz]
    name_template: "ktms_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, NOTICE]

checksum:
  name_template: checksums.txt

# One SPDX SBOM per archive, built by syft.
sboms:
  - artifacts: archive

# A keyless signature of checksums.txt covers every archive listed in it.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]

# Developer ID signing and notarization; skipped unless the secrets are set.
# A tap token must be exactly {{ .Env.NAME }}: GoReleaser refuses anything else there.
# It is read only on upload, which skip_upload turns off when the secret is unset.
notarize:
  macos:
    - enabled: '{{ if index .Env "MACOS_SIGN_P12" }}true{{ else }}false{{ end }}'
      ids: [node, server, cli]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

# brew installs do not set the quarantine flag, so unsigned binaries run.
brews:
  - name: ktms-node
    ids: [node]
    homepage: https://github.com/ai-process/ktms
    description: Node agent that registers a local inference engine with KTMS
    license: Apache-2.0
    repository:
      owner: ai-process
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    test: |
      system "#{bin}/ktms-node", "--version"
  - name: ktms
    ids: [cli]
    homepage: https://github.com/ai-process/ktms
    description: Command-line administration of a Keystone (KTMS) gateway
    license: Apache-2.0
    repository:
      owner: ai-process
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    install: |
      bin.install "ktms"
      generate_completions_from_executable(bin/"ktms", "completion")
    test: |
      system "#{bin}/ktms", "version"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
