# Release: `git tag vX.Y.Z && git push origin vX.Y.Z` runs .github/workflows/release.yml.
# macOS signing and the Homebrew tap switch on only when their secrets exist.
version: 2
project_name: llm-proxy

builds:
  - id: node
    main: ./cmd/node-agent
    binary: llm-proxy-node
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
  - id: server
    main: ./cmd/server
    binary: llm-proxy-server
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w"]

archives:
  - id: node
    ids: [node]
    formats: [tar.gz]
    name_template: "llm-proxy-node_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE]
  - id: server
    ids: [server]
    formats: [tar.gz]
    name_template: "llm-proxy-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE]

checksum:
  name_template: checksums.txt

# Developer ID signing and notarization; skipped unless the secrets are set.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [node, server]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

# brew installs do not set the quarantine flag, so unsigned binaries run.
brews:
  - name: llm-proxy-node
    ids: [node]
    homepage: https://github.com/ai-process/llm-proxy
    description: Node agent that registers a local inference engine with llm-proxy
    license: MIT
    repository:
      owner: ai-process
      name: homebrew-tap
      token: '{{ if isEnvSet "HOMEBREW_TAP_TOKEN" }}{{ .Env.HOMEBREW_TAP_TOKEN }}{{ end }}'
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    test: |
      system "#{bin}/llm-proxy-node", "--version"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
