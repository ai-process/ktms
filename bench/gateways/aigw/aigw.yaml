# Agent Router (Envoy AI Gateway) standalone: `aigw run /config/aigw.yaml`
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: aigw-run }
spec: { controllerName: gateway.envoyproxy.io/gatewayclass-controller }
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: aigw-run, namespace: default }
spec:
  gatewayClassName: aigw-run
  listeners: [{ name: http, protocol: HTTP, port: 1975 }]
  infrastructure:
    parametersRef: { group: gateway.envoyproxy.io, kind: EnvoyProxy, name: envoy-ai-gateway }
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata: { name: envoy-ai-gateway, namespace: default }
spec:
  concurrency: 4
  logging: { level: { default: error } }
  telemetry:
    accessLog: { disable: true }
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata: { name: aigw-run, namespace: default }
spec:
  parentRefs: [{ name: aigw-run, kind: Gateway, group: gateway.networking.k8s.io }]
  rules:
    - matches: [{ headers: [{ type: Exact, name: x-ai-eg-model, value: gpt-4o-mini }] }]
      backendRefs: [{ name: mock, namespace: default }]
      timeouts: { request: 120s }
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata: { name: mock, namespace: default }
spec:
  endpoints: [{ fqdn: { hostname: mock-upstream, port: 8000 } }]
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata: { name: mock, namespace: default }
spec:
  schema: { name: OpenAI }
  backendRef: { name: mock, kind: Backend, group: gateway.envoyproxy.io, namespace: default }
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata: { name: client-buffer-limit, namespace: default }
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: Gateway, name: aigw-run }]
  connection: { bufferLimit: 50Mi }
---
apiVersion: v1
kind: Secret
metadata: { name: mock-apikey, namespace: default }
type: Opaque
stringData: { apiKey: mock-key }
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata: { name: mock-apikey, namespace: default }
spec:
  targetRefs: [{ group: aigateway.envoyproxy.io, kind: AIServiceBackend, name: mock }]
  type: APIKey
  apiKey: { secretRef: { name: mock-apikey } }
---
