#cloud-config
# SUT: Docker with compose/buildx; run_cloud.sh ships the repo and starts the stack.
package_update: true
packages: [curl, python3]

users:
  - default
  - name: ${ssh_user}
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys: ["${ssh_public_key}"]

write_files:
  # Classic overlay2 store: with the containerd store, `docker image inspect .Size`
  # also counts compressed layers, which inflated reported image sizes.
  - path: /etc/docker/daemon.json
    content: |
      {"features": {"containerd-snapshotter": false}}
  - path: /etc/sysctl.d/99-bench.conf
    content: |
      net.core.somaxconn = 65535
      net.ipv4.tcp_max_syn_backlog = 65535
      net.ipv4.ip_local_port_range = 1024 65535
      net.ipv4.tcp_tw_reuse = 1
      fs.file-max = 2097152

runcmd:
  # Cost guard: powers off even if the orchestrator dies before terraform destroy.
  - shutdown -h +300
  - sysctl --system
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker
  - usermod -aG docker ${ssh_user}
  - install -d -o ${ssh_user} /opt/bench
