<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .ktms { fill: #ddf4ff; stroke: #0969da; }
    .node { fill: #dafbe1; stroke: #1a7f37; }
    .owner { fill: #fff8c5; stroke: #9a6700; }
    .t { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .s { fill: #59636e; font-size: 12px; }
    .l { fill: #1f2328; font-size: 12px; }
    .line { stroke: #59636e; stroke-width: 1.6; fill: none; }
    .local { stroke: #1a7f37; stroke-width: 2.2; fill: none; }
    .fb { stroke: #59636e; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
    .ah { fill: #59636e; }
    .ahl { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .ktms { fill: #0c2d6b; stroke: #4493f8; }
      .node { fill: #0f2f1b; stroke: #3fb950; }
      .owner { fill: #3b2e0a; stroke: #d29922; }
      .t, .l { fill: #f0f6fc; }
      .s { fill: #9198a1; }
      .line, .fb { stroke: #9198a1; }
      .ah { fill: #9198a1; }
      .local { stroke: #3fb950; }
      .ahl { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ahl" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="880" height="290" rx="12"/>

  <rect class="box" x="20" y="105" width="170" height="70" rx="10"/>
  <text class="t" x="105" y="135" text-anchor="middle">Your services</text>
  <text class="s" x="105" y="156" text-anchor="middle">apps, agents, scripts</text>

  <rect class="ktms" x="310" y="105" width="160" height="70" rx="10"/>
  <text class="t" x="390" y="135" text-anchor="middle">Keystone</text>
  <text class="s" x="390" y="156" text-anchor="middle">routing · limits · usage</text>

  <rect class="node" x="610" y="20" width="250" height="80" rx="10"/>
  <text class="t" x="735" y="52" text-anchor="middle">Your node</text>
  <text class="s" x="735" y="74" text-anchor="middle">Mac or GPU box · Ollama, vLLM…</text>

  <rect class="owner" x="640" y="128" width="190" height="34" rx="17"/>
  <text class="l" x="735" y="150" text-anchor="middle">Owner: schedule · pause · tray</text>

  <rect class="box" x="610" y="195" width="250" height="70" rx="10"/>
  <text class="t" x="735" y="225" text-anchor="middle">Cloud vendors</text>
  <text class="s" x="735" y="246" text-anchor="middle">OpenAI · Anthropic · Gemini…</text>

  <path class="line" d="M190,140 L306,140" marker-end="url(#a)"/>
  <text class="l" x="248" y="130" text-anchor="middle">one API, one key</text>

  <path class="local" d="M470,128 L520,128 L520,60 L606,60" marker-end="url(#al)"/>
  <text class="l" x="563" y="50" text-anchor="middle">local first</text>

  <path class="fb" d="M470,152 L520,152 L520,230 L606,230" marker-end="url(#a)"/>
  <text class="l" x="563" y="220" text-anchor="middle">fallback</text>

  <path class="line" d="M735,128 L735,104" marker-end="url(#a)"/>
</svg>
