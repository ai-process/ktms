<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .group { fill: #f6f8fa; stroke: #d0d7de; }
    .g-ktms { fill: #ddf4ff; stroke: #0969da; }
    .g-node { fill: #dafbe1; stroke: #1a7f37; }
    .g-warn { fill: #fff8c5; stroke: #9a6700; }
    .box { fill: #ffffff; stroke: #d0d7de; }
    .b-plain { fill: #f6f8fa; stroke: #d0d7de; }
    .b-ktms { fill: #ddf4ff; stroke: #0969da; }
    .b-node { fill: #dafbe1; stroke: #1a7f37; }
    .b-warn { fill: #fff8c5; stroke: #9a6700; }
    .b-hot { fill: #fff1e5; stroke: #bc4c00; }
    .b-bad { fill: #ffebe9; stroke: #cf222e; }
    .b-purple { fill: #fbefff; stroke: #8250df; }
    .gl { fill: #1f2328; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
    .t { fill: #1f2328; font-size: 14px; font-weight: 600; }
    .s { fill: #59636e; font-size: 11.5px; }
    .l { fill: #1f2328; font-size: 11.5px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a-line { stroke: #59636e; stroke-width: 1.6; fill: none; }
    .a-call { stroke: #0969da; stroke-width: 2.2; fill: none; }
    .a-ok { stroke: #1a7f37; stroke-width: 2.2; fill: none; }
    .a-dash { stroke: #59636e; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
    .a-bad { stroke: #cf222e; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
    .h-line, .h-dash { fill: #59636e; }
    .h-call { fill: #0969da; }
    .h-ok { fill: #1a7f37; }
    .h-bad { fill: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .group { fill: #161b22; stroke: #3d444d; }
      .g-ktms { fill: #0a2348; stroke: #4493f8; }
      .g-node { fill: #0c2616; stroke: #3fb950; }
      .g-warn { fill: #2e2207; stroke: #d29922; }
      .box { fill: #0d1117; stroke: #3d444d; }
      .b-plain { fill: #161b22; stroke: #3d444d; }
      .b-ktms { fill: #0c2d6b; stroke: #4493f8; }
      .b-node { fill: #0f2f1b; stroke: #3fb950; }
      .b-warn { fill: #3b2e0a; stroke: #d29922; }
      .b-hot { fill: #3d1d06; stroke: #db6d28; }
      .b-bad { fill: #3c0d12; stroke: #f85149; }
      .b-purple { fill: #2a1650; stroke: #ab7df8; }
      .gl, .t, .l { fill: #f0f6fc; }
      .s { fill: #9198a1; }
      .a-line, .a-dash { stroke: #9198a1; }
      .h-line, .h-dash { fill: #9198a1; }
      .a-call { stroke: #4493f8; } .h-call { fill: #4493f8; }
      .a-ok { stroke: #3fb950; } .h-ok { fill: #3fb950; }
      .a-bad { stroke: #f85149; } .h-bad { fill: #f85149; }
    }
  </style>
  <defs><marker id="h-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="h-line" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="h-call" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="h-ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="h-dash" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="h-bad" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="bg" width="960" height="330" rx="12"/>
  <rect class="group" x="20" y="20" width="320" height="290" rx="12"/>
  <text class="gl" x="38" y="46">WHO CALLS</text>
  <rect class="box" x="40" y="60" width="280" height="56" rx="9"/>
  <text class="t" x="180.0" y="84.0" text-anchor="middle">Organization</text>
  <text class="s" x="180.0" y="103.0" text-anchor="middle">acme</text>
  <rect class="box" x="60" y="140" width="260" height="56" rx="9"/>
  <text class="t" x="190.0" y="164.0" text-anchor="middle">Team</text>
  <text class="s" x="190.0" y="183.0" text-anchor="middle">search · budget, allowed models</text>
  <rect class="b-ktms" x="80" y="220" width="240" height="64" rx="9"/>
  <text class="t" x="200.0" y="248.0" text-anchor="middle">Client key</text>
  <text class="s" x="200.0" y="267.0" text-anchor="middle">ktms_… · scopes, policy</text>
  <path class="a-line" d="M180,116 L180,136" marker-end="url(#h-line)"/>
  <path class="a-line" d="M200,196 L200,216" marker-end="url(#h-line)"/>
  <rect class="b-warn" x="390" y="60" width="180" height="64" rx="9"/>
  <text class="t" x="480.0" y="88.0" text-anchor="middle">Spend limits</text>
  <text class="s" x="480.0" y="107.0" text-anchor="middle">USD per day or month</text>
  <path class="a-dash" d="M386,92 L344,92" marker-end="url(#h-dash)"/>
  <text class="s" x="480" y="145" text-anchor="middle">cap keys, users, teams</text>
  <rect class="b-hot" x="390" y="220" width="180" height="64" rx="9"/>
  <text class="t" x="480.0" y="248.0" text-anchor="middle">Vendor keys</text>
  <text class="s" x="480.0" y="267.0" text-anchor="middle">encrypted, per client key</text>
  <path class="a-line" d="M320,252 L386,252" marker-end="url(#h-line)"/>
  <rect class="group" x="620" y="20" width="320" height="290" rx="12"/>
  <text class="gl" x="638" y="46">WHAT ANSWERS</text>
  <rect class="b-ktms" x="640" y="60" width="280" height="56" rx="9"/>
  <text class="t" x="780.0" y="84.0" text-anchor="middle">Rules</text>
  <text class="s" x="780.0" y="103.0" text-anchor="middle">needs + attributes → a chain</text>
  <rect class="b-ktms" x="640" y="150" width="280" height="56" rx="9"/>
  <text class="t" x="780.0" y="174.0" text-anchor="middle">Models</text>
  <text class="s" x="780.0" y="193.0" text-anchor="middle">competencies, prices, capabilities</text>
  <rect class="b-plain" x="640" y="240" width="280" height="50" rx="9"/>
  <text class="t" x="780.0" y="270.0" text-anchor="middle">Vendors and nodes</text>
  <path class="a-line" d="M780,116 L780,146" marker-end="url(#h-line)"/>
  <path class="a-line" d="M780,206 L780,236" marker-end="url(#h-line)"/>
  <path class="a-line" d="M570,252 L600,252 L600,178 L636,178" marker-end="url(#h-line)"/>
  <text class="s" x="480" y="304" text-anchor="middle">unlocks that vendor's models</text>
</svg>
