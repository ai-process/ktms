  <text class="t" x="445.0" y="305.0" text-anchor="middle">usage events, metrics</text>
  <rect class="b-plain" x="720" y="50" width="220" height="56" rx="9"/>
  <text class="t mono" x="830.0" y="74.0" text-anchor="middle">github</text>
  <text class="s" x="830.0" y="93.0" text-anchor="middle">Streamable HTTP</text>
  <path class="a-line" d="M610,150 L660,150 L660,78 L716,78" marker-end="url(#h-line)"/>
  <rect class="b-plain" x="720" y="130" width="220" height="56" rx="9"/>
  <text class="t mono" x="830.0" y="154.0" text-anchor="middle">docs</text>
  <text class="s" x="830.0" y="173.0" text-anchor="middle">SSE</text>
  <path class="a-line" d="M610,150 L660,150 L660,158 L716,158" marker-end="url(#h-line)"/>
  <rect class="b-plain" x="720" y="210" width="220" height="56" rx="9"/>
  <text class="t mono" x="830.0" y="234.0" text-anchor="middle">internal</text>
  <text class="s" x="830.0" y="253.0" text-anchor="middle">allow_private</text>
  <path class="a-line" d="M610,150 L660,150 L660,238 L716,238" marker-end="url(#h-line)"/>
  <text class="s" x="665" y="40" text-anchor="middle">+ credential header</text>
