  <text class="s" x="639.6" y="105" text-anchor="middle">▲</text>
  <text class="l" x="639.6" y="128" text-anchor="middle">placement</text>
  <text class="t mono" x="639.6" y="68" text-anchor="middle" font-size="17">cloud-first</text>
  <text class="s mono" x="440" y="160" text-anchor="middle">model: "auto:medical=basic,legal=proficient:cloud-first"</text>
