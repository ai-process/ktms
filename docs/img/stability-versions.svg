<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .group { fill: #f6f8fa; stroke: #d0d7de; }
    .g-ktms { fill: #ddf4ff; stroke: #0969da; }
    .g-node { fill: #dafbe1; stroke: #1a7f37; }
    .g-warn { fill: #fff8c5; stroke: #9a6700; }
    .box { fill: #ffffff; stroke: #d0d7de; }
    .b-plain { fill: #f6f8fa; stroke: #d0d7de; }
    .b-ktms { fill: #ddf4ff; stroke: #0969da; }
    .b-node { fill: #dafbe1; stroke: #1a7f37; }
    .b-warn { fill: #fff8c5; stroke: #9a6700; }
    .b-hot { fill: #fff1e5; stroke: #bc4c00; }
    .b-bad { fill: #ffebe9; stroke: #cf222e; }
    .b-purple { fill: #fbefff; stroke: #8250df; }
    .gl { fill: #1f2328; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
    .t { fill: #1f2328; font-size: 14px; font-weight: 600; }
    .s { fill: #59636e; font-size: 11.5px; }
    .l { fill: #1f2328; font-size: 11.5px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a-line { stroke: #59636e; stroke-width: 1.6; fill: none; }
    .a-call { stroke: #0969da; stroke-width: 2.2; fill: none; }
    .a-ok { stroke: #1a7f37; stroke-width: 2.2; fill: none; }
    .a-dash { stroke: #59636e; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
    .a-bad { stroke: #cf222e; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
    .h-line, .h-dash { fill: #59636e; }
    .h-call { fill: #0969da; }
    .h-ok { fill: #1a7f37; }
    .h-bad { fill: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .group { fill: #161b22; stroke: #3d444d; }
      .g-ktms { fill: #0a2348; stroke: #4493f8; }
      .g-node { fill: #0c2616; stroke: #3fb950; }
      .g-warn { fill: #2e2207; stroke: #d29922; }
      .box { fill: #0d1117; stroke: #3d444d; }
      .b-plain { fill: #161b22; stroke: #3d444d; }
      .b-ktms { fill: #0c2d6b; stroke: #4493f8; }
      .b-node { fill: #0f2f1b; stroke: #3fb950; }
      .b-warn { fill: #3b2e0a; stroke: #d29922; }
      .b-hot { fill: #3d1d06; stroke: #db6d28; }
      .b-bad { fill: #3c0d12; stroke: #f85149; }
      .b-purple { fill: #2a1650; stroke: #ab7df8; }
      .gl, .t, .l { fill: #f0f6fc; }
      .s { fill: #9198a1; }
      .a-line, .a-dash { stroke: #9198a1; }
      .h-line, .h-dash { fill: #9198a1; }
      .a-call { stroke: #4493f8; } .h-call { fill: #4493f8; }
      .a-ok { stroke: #3fb950; } .h-ok { fill: #3fb950; }
      .a-bad { stroke: #f85149; } .h-bad { fill: #f85149; }
    }
  </style>
  <defs><marker id="h-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="h-line" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="h-call" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="h-ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="h-dash" d="M0,0 L10,5 L0,10 z"/></marker><marker id="h-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="h-bad" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="bg" width="880" height="190" rx="12"/>
  <path class="a-ok" d="M40,90 L700,90" marker-end="url(#h-ok)"/>
  <circle class="b-node" cx="60" cy="90" r="9"/>
  <text class="t" x="60" y="66" text-anchor="middle">1.0</text>
  <circle class="b-node" cx="200" cy="90" r="9"/>
  <text class="t" x="200" y="66" text-anchor="middle">1.3</text>
  <circle class="b-node" cx="340" cy="90" r="9"/>
  <text class="t" x="340" y="66" text-anchor="middle">1.6</text>
  <circle class="b-node" cx="480" cy="90" r="9"/>
  <text class="t" x="480" y="66" text-anchor="middle">1.7</text>
  <circle class="b-node" cx="620" cy="90" r="9"/>
  <text class="t" x="620" y="66" text-anchor="middle">1.x</text>
  <text class="l" x="340" y="130" text-anchor="middle">minor releases only add: RPCs, fields, endpoints, settings</text>
  <text class="s" x="340" y="150" text-anchor="middle">patch releases fix bugs · upgrade from any 1.x in one step</text>
  <circle class="b-bad" cx="800" cy="90" r="11"/>
  <path class="a-dash" d="M712,90 L786,90" marker-end="url(#h-dash)"/>
  <text class="t" x="800" y="66" text-anchor="middle">2.0</text>
  <text class="l" x="800" y="130" text-anchor="middle">breaking changes</text>
  <text class="s" x="800" y="150" text-anchor="middle">and removals</text>
  <rect class="b-warn" x="220" y="10" width="240" height="28" rx="14.0"/>
  <text class="l" x="340.0" y="28.0" text-anchor="middle">experimental parts may change in a minor</text>
</svg>
