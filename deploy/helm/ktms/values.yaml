# Default values for ktms.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: coyl/ktms
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials (default false for restricted security)
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

terminationGracePeriodSeconds: 60

lifecycle:
  preStop:
    exec:
      command: ["/bin/sleep", "5"]

service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 9090
  metricsPort: 9091
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: ktms.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: ktms-tls
  #    hosts:
  #      - ktms.local

  # Dedicated gRPC ingress config if your ingress controller requires distinct annotations
  # (e.g. nginx.ingress.kubernetes.io/backend-protocol: "GRPC")
  grpc:
    enabled: false
    className: ""
    annotations: {}
      # nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    hosts:
      - host: grpc.ktms.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

probes:
  # startupProbe accommodates schema migration locks during rolling deployments
  startup:
    enabled: true
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 40  # 40 * 5s = 200s (> MIGRATE_TIMEOUT 3m)
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3

# Secret credentials: can be provided inline (creates a Secret) or via an existingSecret
secrets:
  # If set, secrets.databaseUrl and secrets.encryptionKeys are read from this secret instead.
  # Expected keys: DATABASE_URL, KTMS_ENCRYPTION_KEYS (legacy LLMPROXY_ENCRYPTION_KEYS is still read), and optionally BOOTSTRAP_ADMIN_KEY, REDIS_PASSWORD.
  existingSecret: ""
  # PostgreSQL connection URL (e.g., postgres://user:pass@postgres-host:5432/ktms?sslmode=require)
  databaseUrl: ""
  # Versioned AES-256-GCM keyring spec (e.g., "1:<base64-32B-key>,2:...")
  encryptionKeys: ""
  # Optional initial admin bootstrap key for minting client API keys
  bootstrapAdminKey: ""
  # Optional password for Redis authentication
  redisPassword: ""

config:
  httpApiEnabled: true
  logLevel: "info"
  autoMigrate: true
  autoSeed: false
  routingReloadSeconds: 60
  # Redis connection address (e.g. "redis-master:6379")
  redisAddr: ""
  redisKeyPrefix: ""
  # Circuit breaker settings
  circuitBreakerEnabled: true
  circuitBreakerFailThreshold: 5
  circuitBreakerCooldown: "30s"
  # Spend limits fail mode: "closed" (fail-safe refusal if Redis is unreachable) or "open" (unmetered bypass).
  # Note: The standalone app defaults to "open"; the Helm chart defaults to "closed" for production fail-safety.
  spendLimitsFailMode: "closed"
  budgetGraceMargin: 0.05
  # Optional gRPC usage collector sink
  usageCollectorHost: ""
  usageCollectorTLS: false
  usageProjectID: ""
  # Extra environment variables or Secret/ConfigMap refs
  extraEnv: []
  extraEnvFrom: []

metrics:
  # Exposes metrics port on Service (service.metricsPort) and container for Prometheus scraping
  enabled: true
  # Prometheus Operator ServiceMonitor
  serviceMonitor:
    enabled: false
    interval: "15s"
    scrapeTimeout: "10s"
    labels: {}

extraVolumes: []
extraVolumeMounts: []

topologySpreadConstraints: []
nodeSelector: {}
tolerations: []
affinity: {}
