{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ktms.fullname" . }}
  labels:
    {{- include "ktms.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ required "A valid secrets.databaseUrl or secrets.existingSecret is required" .Values.secrets.databaseUrl | toString | b64enc | quote }}
  KTMS_ENCRYPTION_KEYS: {{ required "A valid secrets.encryptionKeys or secrets.existingSecret is required" .Values.secrets.encryptionKeys | toString | b64enc | quote }}
  {{- if .Values.secrets.bootstrapAdminKey }}
  BOOTSTRAP_ADMIN_KEY: {{ .Values.secrets.bootstrapAdminKey | toString | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.usageCollectorToken }}
  USAGE_COLLECTOR_TOKEN: {{ .Values.secrets.usageCollectorToken | toString | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.redisPassword }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | toString | b64enc | quote }}
  {{- end }}
{{- end }}
