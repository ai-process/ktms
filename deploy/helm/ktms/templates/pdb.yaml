{{- if .Values.podDisruptionBudget.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ktms.fullname" . }}
  labels:
    {{- include "ktms.labels" . | nindent 4 }}
spec:
  {{- if hasKey .Values.podDisruptionBudget "maxUnavailable" }}
    {{- if and (ne .Values.podDisruptionBudget.maxUnavailable nil) (ne (toString .Values.podDisruptionBudget.maxUnavailable) "") }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
    {{- end }}
  {{- else if hasKey .Values.podDisruptionBudget "minAvailable" }}
    {{- if and (ne .Values.podDisruptionBudget.minAvailable nil) (ne (toString .Values.podDisruptionBudget.minAvailable) "") }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ktms.selectorLabels" . | nindent 6 }}
{{- end }}
