apiVersion: v1
kind: Service
metadata:
  name: {{ include "ktms.fullname" . }}
  labels:
    {{- include "ktms.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
      appProtocol: http
    - port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      name: grpc
      appProtocol: grpc
    {{- if .Values.metrics.enabled }}
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
      appProtocol: http
    {{- end }}
  selector:
    {{- include "ktms.selectorLabels" . | nindent 4 }}
