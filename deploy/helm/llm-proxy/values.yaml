# Default values for llm-proxy.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: coyl/llm-proxy
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 9090
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: llm-proxy.local
      paths:
        - path: /
          pathType: Prefix
          port: 8080
  tls: []
  #  - secretName: llm-proxy-tls
  #    hosts:
  #      - llm-proxy.local

  # Dedicated gRPC ingress config if your ingress controller requires distinct annotations
  # (e.g. nginx.ingress.kubernetes.io/backend-protocol: "GRPC")
  grpc:
    enabled: false
    className: ""
    annotations: {}
      # nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    hosts:
      - host: grpc.llm-proxy.local
        paths:
          - path: /
            pathType: Prefix
            port: 9090
    tls: []

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

probes:
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Secret credentials: can be provided inline (creates a Secret) or via an existingSecret
secrets:
  # If set, secrets.databaseUrl and secrets.encryptionKeys are read from this secret instead.
  # Expected keys: DATABASE_URL, LLMPROXY_ENCRYPTION_KEYS, and optionally BOOTSTRAP_ADMIN_KEY.
  existingSecret: ""
  # PostgreSQL connection URL (e.g., postgres://user:pass@postgres-host:5432/llmproxy?sslmode=require)
  databaseUrl: ""
  # Versioned AES-256-GCM keyring spec (e.g., "1:<base64-32B-key>,2:...")
  encryptionKeys: ""
  # Optional initial admin bootstrap key for minting client API keys
  bootstrapAdminKey: ""

config:
  httpApiEnabled: true
  logLevel: "info"
  autoMigrate: true
  autoSeed: false
  routingReload: "2s"
  # Redis connection address (e.g. "redis-master:6379")
  redisAddr: ""
  redisKeyPrefix: ""
  # Circuit breaker settings
  circuitBreakerEnabled: true
  circuitBreakerFailThreshold: 5
  circuitBreakerCooldown: "30s"
  # Spend limits fail mode: "closed" (fail-safe) or "open" (unmetered fallback if Redis down)
  spendLimitsFailMode: "closed"
  budgetGraceMargin: 0.05
  # Optional gRPC usage collector sink
  usageCollectorHost: ""
  usageCollectorTLS: false
  usageProjectID: ""
  # Extra environment variables or Secret/ConfigMap refs
  extraEnv: []
  extraEnvFrom: []

metrics:
  enabled: true
  # Prometheus Operator ServiceMonitor
  serviceMonitor:
    enabled: false
    interval: "15s"
    scrapeTimeout: "10s"
    labels: {}

nodeSelector: {}
tolerations: []
affinity: {}
