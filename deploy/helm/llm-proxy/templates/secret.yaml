{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-proxy.fullname" . }}
  labels:
    {{- include "llm-proxy.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.encryptionKeys }}
  LLMPROXY_ENCRYPTION_KEYS: {{ .Values.secrets.encryptionKeys | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.bootstrapAdminKey }}
  BOOTSTRAP_ADMIN_KEY: {{ .Values.secrets.bootstrapAdminKey | b64enc | quote }}
  {{- end }}
{{- end }}
