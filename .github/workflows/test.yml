name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Without a database the Postgres-backed tests skip, so CI provides one.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gen
          POSTGRES_PASSWORD: gen
          POSTGRES_DB: gen_test
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U gen -d gen_test" --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Run tests
        env:
          REQUIRE_DB: "1" # the Postgres-backed tests fail rather than skip
        run: go test -race ./...

      - name: Installer script tests
        run: |
          shellcheck -s sh scripts/install-node.sh scripts/install-node_test.sh
          sh scripts/install-node_test.sh

  # A known vulnerability that our code reaches fails the build; one in a
  # dependency we never call is only reported.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
          GOOS=darwin govulncheck ./... # GOOS picks the code to scan, not the tool's build

  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the script picks the previous release from the tags
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Upgrade from the previous release
        run: ./scripts/upgrade-test.sh

  # The plugin's skills against this checkout and light-tokenmeter's main (its
  # first release with the CLI is still to come; then pin it to that tag).
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: light-tokenmeter's CLI and README
        run: |
          GOBIN="$RUNNER_TEMP" go install github.com/ai-process/light-tokenmeter/cmd/tokenmeter@main
          curl -fsSL https://raw.githubusercontent.com/ai-process/light-tokenmeter/main/README.md -o "$RUNNER_TEMP/tokenmeter-README.md"
          curl -fsSL https://raw.githubusercontent.com/ai-process/light-tokenmeter/main/cmd/tokenmeter/mcp.go -o "$RUNNER_TEMP/tokenmeter-mcp.go"
      - name: Skills
        run: go test -count=1 -run '^TestSkill' ./cmd/ktms/
        env:
          TOKENMETER_BIN: ${{ runner.temp }}/tokenmeter
          TOKENMETER_README: ${{ runner.temp }}/tokenmeter-README.md
          TOKENMETER_MCP_SRC: ${{ runner.temp }}/tokenmeter-mcp.go
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Plugin and marketplace manifests
        run: |
          npx -y @anthropic-ai/claude-code plugin validate --strict ./plugin
          npx -y @anthropic-ai/claude-code plugin validate --strict .

  # The ktms CLI against a built Keystone: config apply, keys mint, chat, spend get.
  cli-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: CLI end to end
        run: ./scripts/cli-e2e.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server slim image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: slim
          push: false
          cache-from: type=gha,scope=server-slim
          cache-to: type=gha,mode=max,scope=server-slim
      - name: Build server audio image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: audio
          push: false
          cache-from: type=gha,scope=server-audio
          cache-to: type=gha,mode=max,scope=server-audio
      - name: Build node-agent image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.node-agent
          push: false
          cache-from: type=gha,scope=node-agent
          cache-to: type=gha,mode=max,scope=node-agent
      - name: Build CLI image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cli
          push: false
          cache-from: type=gha,scope=cli
          cache-to: type=gha,mode=max,scope=cli

  # The chart installed from an OCI registry on a fresh cluster, as users do.
  helm-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
      - uses: docker/setup-buildx-action@v3
      - name: Build server slim image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: slim
          load: true
          tags: coyl/ktms:ci
          cache-from: type=gha,scope=server-slim
      - run: ./scripts/helm-kind.sh
        env:
          IMAGE: coyl/ktms:ci

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Lint Helm chart
        run: helm lint --strict deploy/helm/ktms
      - name: Dry-run Helm template (existingSecret)
        run: helm template test deploy/helm/ktms --set secrets.existingSecret=my-secret
      - name: Dry-run Helm template (inline secrets)
        run: >
          helm template test deploy/helm/ktms
          --set secrets.databaseUrl="postgres://u:p@db:5432/db"
          --set secrets.encryptionKeys="1:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY="
      - name: Dry-run Helm template (all features enabled)
        run: >
          helm template test deploy/helm/ktms
          --set ingress.enabled=true
          --set ingress.grpc.enabled=true
          --set autoscaling.enabled=true
          --set metrics.serviceMonitor.enabled=true
          --set podDisruptionBudget.enabled=true
          --set secrets.existingSecret=my-secret
