name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

      - name: Installer script tests
        run: sh scripts/install-node_test.sh

  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the script picks the previous release from the tags
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Upgrade from the previous release
        run: ./scripts/upgrade-test.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server slim image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: slim
          push: false
          cache-from: type=gha,scope=server-slim
          cache-to: type=gha,mode=max,scope=server-slim
      - name: Build server audio image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: audio
          push: false
          cache-from: type=gha,scope=server-audio
          cache-to: type=gha,mode=max,scope=server-audio
      - name: Build node-agent image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.node-agent
          push: false
          cache-from: type=gha,scope=node-agent
          cache-to: type=gha,mode=max,scope=node-agent

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Lint Helm chart
        run: helm lint --strict deploy/helm/ktms
      - name: Dry-run Helm template (existingSecret)
        run: helm template test deploy/helm/ktms --set secrets.existingSecret=my-secret
      - name: Dry-run Helm template (inline secrets)
        run: >
          helm template test deploy/helm/ktms
          --set secrets.databaseUrl="postgres://u:p@db:5432/db"
          --set secrets.encryptionKeys="1:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY="
      - name: Dry-run Helm template (all features enabled)
        run: >
          helm template test deploy/helm/ktms
          --set ingress.enabled=true
          --set ingress.grpc.enabled=true
          --set autoscaling.enabled=true
          --set metrics.serviceMonitor.enabled=true
          --set podDisruptionBudget.enabled=true
          --set secrets.existingSecret=my-secret
