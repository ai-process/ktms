name: Compatibility

# Called once per v* tag by release.yml; the binaries and the images both wait
# for it, so neither goes out when the release breaks the one before it.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # A release must stay compatible with the one before it: same proto, and a
  # database it can take over. A tag that changes an Experimental ktms.v1
  # element on purpose is named in the ALLOW_BREAKING_TAG repository variable;
  # usage.v1 has nothing experimental and is always checked.
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Previous published release
        id: prev
        env:
          CUR: ${{ github.ref_name }}
        run: echo "tag=$(./scripts/upgrade-test.sh --print-prev | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: ktms.v1 compatible with the previous release
        if: vars.ALLOW_BREAKING_TAG != github.ref_name
        run: buf breaking --against ".git#tag=${{ steps.prev.outputs.tag }}"
      - name: usage.v1 compatible with the previous release
        working-directory: usage-proto
        run: |
          buf breaking . --against "../.git#tag=${{ steps.prev.outputs.tag }},subdir=usage-proto" \
            --config '{"version":"v2","breaking":{"use":["FILE"]}}'
      - name: Upgrade from the previous releases
        env:
          CUR: ${{ github.ref_name }}
        run: ./scripts/upgrade-test.sh

