name: Publish Docker image

# Every v* release becomes images on Docker Hub: coyl/ktms:<tag> (server slim & audio)
# and coyl/ktms-node:<tag> (node agent).
# Needs the repository secrets DOCKER_USERNAME and DOCKER_PASSWORD (an access token).
# Called by release.yml after the compatibility check passed.
on:
  workflow_call:
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: coyl/ktms
            dockerfile: Dockerfile
            target: slim
            flavor_latest: "true"
            tag_suffix: ""
            scope: coyl-ktms-slim
          - image: coyl/ktms
            dockerfile: Dockerfile
            target: audio
            flavor_latest: "false"
            tag_suffix: "-audio"
            scope: coyl-ktms-audio
          - image: coyl/ktms-node
            dockerfile: Dockerfile.node-agent
            target: ""
            flavor_latest: "true"
            tag_suffix: ""
            scope: coyl-ktms-node
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A backport (v1.0.3 after v1.2.0) must not move latest, slim or audio
      # back to an older line, so those follow only the newest stable tag.
      - name: Is this the newest release
        id: newest
        run: |
          top=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          echo "yes=$([ "$top" = "$GITHUB_REF_NAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=tag,suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.tag_suffix }}
            type=raw,value=audio,enable=${{ matrix.target == 'audio' && steps.newest.outputs.yes == 'true' }}
            type=raw,value=slim,enable=${{ matrix.target == 'slim' && steps.newest.outputs.yes == 'true' }}
            type=ref,event=tag,suffix=-slim,enable=${{ matrix.target == 'slim' }}
            type=semver,pattern={{version}},suffix=-slim,enable=${{ matrix.target == 'slim' }}
            type=semver,pattern={{major}}.{{minor}},suffix=-slim,enable=${{ matrix.target == 'slim' }}
          flavor: |
            latest=${{ matrix.flavor_latest == 'true' && steps.newest.outputs.yes == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.image == 'coyl/ktms-node' && format('VERSION={0}', steps.meta.outputs.version) || '' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
          provenance: false
          sbom: false
