name: Publish Docker image

# Every v* release becomes images on Docker Hub: coyl/ktms:<tag> (server slim & audio),
# coyl/ktms-node:<tag> (node agent) and coyl/ktms-cli:<tag> (the ktms CLI).
# Needs the repository secrets DOCKER_USERNAME and DOCKER_PASSWORD (an access token).
# Called by release.yml after the compatibility check passed.
on:
  workflow_call:
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

permissions:
  contents: read
  id-token: write # keyless cosign signing with the workflow's GitHub OIDC identity

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # Each image signs itself; one leg failing must not cancel another
      # between its push and its signature.
      fail-fast: false
      matrix:
        include:
          - image: coyl/ktms
            dockerfile: Dockerfile
            target: slim
            flavor_latest: "true"
            tag_suffix: ""
            scope: coyl-ktms-slim
          - image: coyl/ktms
            dockerfile: Dockerfile
            target: audio
            flavor_latest: "false"
            tag_suffix: "-audio"
            scope: coyl-ktms-audio
          - image: coyl/ktms-node
            dockerfile: Dockerfile.node-agent
            target: ""
            flavor_latest: "true"
            tag_suffix: ""
            scope: coyl-ktms-node
          - image: coyl/ktms-cli
            dockerfile: Dockerfile.cli
            target: ""
            flavor_latest: "true"
            tag_suffix: ""
            scope: coyl-ktms-cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # A backport or a late re-run must not move latest, slim, audio or X.Y
      # back to an older build: each follows only the newest tag of its line.
      - name: Is this the newest release
        id: newest
        run: |
          stable=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')
          line=$(echo "$GITHUB_REF_NAME" | sed -E 's/^(v[0-9]+\.[0-9]+)\..*/\1/')
          top=$(echo "$stable" | head -n 1)
          top_line=$(echo "$stable" | grep "^$line\." | head -n 1)
          echo "yes=$([ "$top" = "$GITHUB_REF_NAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "line=$([ "$top_line" = "$GITHUB_REF_NAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=tag,suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.tag_suffix }},enable=${{ steps.newest.outputs.line }}
            type=raw,value=audio,enable=${{ matrix.target == 'audio' && steps.newest.outputs.yes == 'true' }}
            type=raw,value=slim,enable=${{ matrix.target == 'slim' && steps.newest.outputs.yes == 'true' }}
            type=ref,event=tag,suffix=-slim,enable=${{ matrix.target == 'slim' }}
            type=semver,pattern={{version}},suffix=-slim,enable=${{ matrix.target == 'slim' }}
            type=semver,pattern={{major}}.{{minor}},suffix=-slim,enable=${{ matrix.target == 'slim' && steps.newest.outputs.line == 'true' }}
          flavor: |
            latest=${{ matrix.flavor_latest == 'true' && steps.newest.outputs.yes == 'true' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
          provenance: mode=max
          sbom: true

      # Pinned by commit: this job can mint signatures under the release identity.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Signs the index digest and, with --recursive, each platform manifest, so
      # a policy checking the pulled linux/arm64 digest finds a signature too.
      # Retried: a Rekor or Fulcio blip must not leave a pushed tag unsigned.
      - name: Sign the image
        run: |
          for i in 1 2 3; do
            cosign sign --yes --recursive "${{ matrix.image }}@${{ steps.build.outputs.digest }}" && exit 0
            sleep $((i * 15))
          done
          exit 1
