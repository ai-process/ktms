name: Publish Docker image

# Every pushed tag becomes images on Docker Hub: coyl/llm-proxy:<tag> (server)
# and coyl/llm-proxy-node:<tag> (node agent).
# Needs the repository secrets DOCKER_USERNAME and DOCKER_PASSWORD (an access token).
on:
  push:
    tags:
      - '*'

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: coyl/llm-proxy
            dockerfile: Dockerfile
            target: slim
            flavor_latest: auto
            tag_suffix: ""
            scope: coyl-llm-proxy-slim
          - image: coyl/llm-proxy
            dockerfile: Dockerfile
            target: audio
            flavor_latest: "false"
            tag_suffix: "-audio"
            scope: coyl-llm-proxy-audio
          - image: coyl/llm-proxy-node
            dockerfile: Dockerfile.node-agent
            target: ""
            flavor_latest: auto
            tag_suffix: ""
            scope: coyl-llm-proxy-node
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=tag,suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.tag_suffix }}
            type=raw,value=audio,enable=${{ matrix.target == 'audio' }}
            type=raw,value=slim,enable=${{ matrix.target == 'slim' }}
            type=ref,event=tag,suffix=-slim,enable=${{ matrix.target == 'slim' }}
            type=semver,pattern={{version}},suffix=-slim,enable=${{ matrix.target == 'slim' }}
            type=semver,pattern={{major}}.{{minor}},suffix=-slim,enable=${{ matrix.target == 'slim' }}
          flavor: |
            latest=${{ matrix.flavor_latest }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.image == 'coyl/llm-proxy-node' && format('VERSION={0}', steps.meta.outputs.version) || '' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
          provenance: false
          sbom: false
