name: Buf

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  buf:
    runs-on: ubuntu-latest
    env:
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The 1.x promise is compatibility with what was released, so the check
      # compares against the newest v* tag, not main. A deliberate change to an
      # Experimental element takes the "buf skip breaking" PR label.
      - name: Latest release tag
        id: release
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v*')" >> "$GITHUB_OUTPUT"

      - name: Lint and Breaking Change Check
        uses: bufbuild/buf-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          lint: true
          breaking: true
          breaking_against: "https://github.com/ai-process/ktms.git#tag=${{ steps.release.outputs.tag }}"
          push: false

      - name: Push to Buf Schema Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.BUF_TOKEN != ''
        uses: bufbuild/buf-action@v1
        with:
          token: ${{ env.BUF_TOKEN }}
          lint: false
          breaking: false
          format: false
          push: true
