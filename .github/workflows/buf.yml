name: Buf

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled so adding "buf skip breaking" re-runs the check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  # light-tokenmeter owns usage.proto; a daily run notices when it moved on.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  pull-requests: write

jobs:
  buf:
    runs-on: ubuntu-latest
    env:
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Each PR is checked against main, so a break is caught in the PR that
      # makes it. A deliberate change to an Experimental element takes the
      # "buf skip breaking" label and a CHANGELOG entry.
      - name: Lint and Breaking Change Check
        uses: bufbuild/buf-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          lint: true
          breaking: true
          breaking_against: "https://github.com/ai-process/ktms.git#branch=${{ github.base_ref || 'main' }}"
          push: false

      # usage.v1 is public too (light-tokenmeter reads it) but is not a module
      # of buf.yaml, so it gets its own check. It has no experimental parts, so
      # the skip label does not apply to it.
      - name: usage.v1 breaking check
        if: github.event_name == 'pull_request'
        working-directory: usage-proto
        run: |
          buf breaking . --against "../.git#ref=origin/${{ github.base_ref }},subdir=usage-proto" \
            --config '{"version":"v2","breaking":{"use":["FILE"]}}'

      # The copy must match light-tokenmeter's main except for go_package, or
      # KTMS reports usage its sink does not expect.
      - name: usage.proto matches light-tokenmeter
        run: |
          curl -fsSL https://raw.githubusercontent.com/ai-process/light-tokenmeter/main/proto/usage/v1/usage.proto \
            | grep -v '^option go_package' > /tmp/upstream.proto
          grep -v '^option go_package' usage-proto/usage/v1/usage.proto \
            | diff -u /tmp/upstream.proto - \
            || { echo "usage-proto/usage/v1/usage.proto differs from light-tokenmeter: copy it over and run make proto"; exit 1; }

      - name: Push to Buf Schema Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.BUF_TOKEN != ''
        uses: bufbuild/buf-action@v1
        with:
          token: ${{ env.BUF_TOKEN }}
          lint: false
          breaking: false
          format: false
          push: true
