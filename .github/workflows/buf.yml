name: Buf

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled so adding "buf skip breaking" re-runs the check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  # light-tokenmeter owns usage.proto; a daily run notices when it moved on.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  pull-requests: write

jobs:
  buf:
    runs-on: ubuntu-latest
    env:
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Each PR is checked against main, so a break is caught in the PR that
      # makes it. A deliberate change to an Experimental element takes the
      # "buf skip breaking" label and a CHANGELOG entry.
      - name: Lint and Breaking Change Check
        uses: bufbuild/buf-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          lint: true
          breaking: true
          breaking_against: "https://github.com/ai-process/ktms.git#branch=${{ github.base_ref || 'main' }}"
          push: false

      # usage.v1 (light-tokenmeter's, not a buf.yaml module) has its own check,
      # without the skip label; go_package is exempt, as buf.gen.usage.yaml sets it.
      - name: usage.v1 breaking check
        if: github.event_name == 'pull_request'
        working-directory: usage-proto
        run: |
          buf breaking . --against "../.git#ref=origin/${{ github.base_ref }},subdir=usage-proto" \
            --config '{"version":"v2","breaking":{"use":["FILE"],"except":["FILE_SAME_GO_PACKAGE"]}}'

      - name: Push to Buf Schema Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.BUF_TOKEN != ''
        uses: bufbuild/buf-action@v1
        with:
          token: ${{ env.BUF_TOKEN }}
          lint: false
          breaking: false
          format: false
          push: true

  # Its own job: drift in light-tokenmeter must not hold up the BSR push.
  usage-proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: 1.69.0
      # light-tokenmeter owns usage.proto; the copy must match its main byte
      # for byte (buf.gen.usage.yaml sets the Go package), or KTMS reports
      # usage its sink does not expect.
      - name: usage.proto matches light-tokenmeter
        run: |
          curl -fsSL https://raw.githubusercontent.com/ai-process/light-tokenmeter/main/proto/usage/v1/usage.proto \
            | diff -u - usage-proto/usage/v1/usage.proto \
            || { echo "usage-proto/usage/v1/usage.proto differs from light-tokenmeter: copy it over and run make clients"; exit 1; }
      - name: Usage stubs match usage-proto/
        run: |
          buf generate usage-proto --template buf.gen.usage.yaml
          if [ -n "$(git status --porcelain -- internal/usagereport/gen)" ]; then
            git status --short -- internal/usagereport/gen
            echo "internal/usagereport/gen is stale: run make clients and commit"; exit 1
          fi
