name: Bug Report
description: Report a reproducible bug or unexpected behavior in KTMS
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure that you do not share any sensitive information such as plaintext API keys or production tokens in your report.

  - type: input
    id: version
    attributes:
      label: KTMS Version / Commit
      description: What version or git commit of KTMS are you running? (e.g., v0.12.0 or commit SHA)
      placeholder: "v0.12.0"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Environment
      options:
        - Docker Compose (local quickstart)
        - Kubernetes / Helm
        - Bare Metal Binary / Systemd
        - Development (go run cmd/server/main.go)
        - Other
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Router & Model Execution (internal/router)
        - Upstream Vendor Adapters (OpenAI, Anthropic, Gemini, Bedrock, etc.)
        - Inference Nodes & Local Pool (internal/nodes)
        - Rate Limiting & Spend Limits (internal/throttle, internal/spendlimit)
        - OpenAI-compatible HTTP Gateway (/v1/chat/completions, etc.)
        - gRPC APIs (GatewayService, AdminService)
        - Circuit Breaker (internal/circuitbreaker)
        - Auto-Seed & Quickstart (internal/seed)
        - Database & Migrations (Postgres, migrations/)
        - Observability & Metrics (OpenTelemetry, Prometheus)
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Exact steps, curl commands, or gRPC requests that trigger the bug.
      placeholder: |
        1. Start proxy with ...
        2. Send request to ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen according to documentation or protocol specification.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Output
      description: Please paste sanitized logs (strip any API keys or tokens).
      render: shell

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I confirmed that no API keys or secret credentials are included in this report.
          required: true
        - label: I searched existing issues and confirmed this bug has not already been reported.
          required: true
