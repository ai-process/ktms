syntax = "proto3";

package ktms.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "ktms/v1/gateway.proto";

option go_package = "github.com/ai-process/ktms/gen/ktms/v1;ktmsv1";

// ModelSpec is a registry entry. Vendor credentials are NOT part of the spec:
// they are per-client rows managed via SetVendorKey.
message ModelSpec {
  string id = 1; // unique registry id, referenced by rules and model_override
  string vendor = 2; // openai | anthropic | google | deepseek | ollama | local | typesafe | groq | mistral | azure | bedrock
  string endpoint = 3; // optional base-URL override
  repeated Effort efforts = 4; // tiers this model may serve
  repeated string capabilities = 5; // e.g. "google_search"
  int32 rpm = 6; // per client key per minute, 0 = unlimited
  double price_in_per_mtok = 7; // standard (off-peak) rate
  double price_out_per_mtok = 8;
  // Peak rates, 0 when the vendor bills one price all day. DeepSeek V4 doubles
  // for two windows daily, so a single price understates its cost.
  double price_in_peak_per_mtok = 12;
  double price_out_peak_per_mtok = 13;
  double price_in_batch_per_mtok = 14;
  double price_out_batch_per_mtok = 15;
  int64 daily_tokens_per_key = 9; // per api key per UTC day, 0 = unlimited
  int64 daily_tokens_per_user = 10; // per attributes["user_id"] (or svc:<key_name> fallback) per UTC day
  bool enabled = 11;
  int32 rpm_burst = 16; // extra burst allowed above steady-state rpm (0 = default burst of rpm - 1, <0 = burst disabled)
  int32 queue_timeout_ms = 17; // max wait for pool inference slot in ms (0 = fallback immediately; capped to 250ms for interactive non-svc users)
  double budget_grace_margin = 18; // allowed daily budget overdraft (0.0 = system default 0.05, <0.0 = disabled)
  // Prompt-cache rates at the standard rate, scaled like input for peak and batch.
  // 0 = a vendor default that never undercharges: anthropic 0.1x input to read
  // and 1.25x to write, bedrock 0.25x and 1.25x, any other vendor 1x.
  double price_cache_read_per_mtok = 19;
  double price_cache_write_per_mtok = 20;
}

message RuleSpec {
  string name = 1; // unique, logged and put in usage meta
  int32 priority = 2; // unique; higher wins, first match takes the request
  Effort effort = 3; // EFFORT_UNSPECIFIED = matches any effort
  map<string, string> attributes = 4; // equality predicates over request attributes
  repeated string use = 5; // ordered fallback chain of model ids, cheaper-first
  bool enabled = 6;
  repeated int32 weights = 7; // traffic weights per model in use; empty means deterministic (100% on use[0]). Canary distribution is deterministic and sticky when request attribute canary_key or user_id is provided, or weighted random if omitted or canary_mode="random".
  // Shadow traffic and its evaluation may change in a 1.x minor release.
  string shadow_model = 8; // Experimental: optional model id for async traffic mirroring
  double shadow_percentage = 9; // Experimental: percentage of requests to mirror (0.0 - 100.0)
  bool shadow_eval = 10; // Experimental: optional automated quality evaluation using Judge
}

message UpsertModelRequest {
  ModelSpec model = 1;
}

message UpsertModelResponse {}

message DeleteModelRequest {
  string id = 1;
}

message DeleteModelResponse {}

// ReplaceRules swaps the whole rule set transactionally. Rules change
// together; per-rule CRUD would deadlock on the catch-all validation.
message ReplaceRulesRequest {
  repeated RuleSpec rules = 1;
}

message ReplaceRulesResponse {}

message SetVendorKeyRequest {
  string api_key_name = 1; // client key this vendor credential is assigned to
  string vendor = 2;
  string plain_key = 3; // encrypted at rest; never stored, logged, or returned
}

message SetVendorKeyResponse {}

message DeleteVendorKeyRequest {
  string api_key_name = 1;
  string vendor = 2;
}

message DeleteVendorKeyResponse {}

message VendorKeyInfo {
  string api_key_name = 1;
  string vendor = 2;
  int32 key_version = 3; // keyring version used to encrypt
  google.protobuf.Timestamp created_at = 4;
  // First 16 hex characters of the key's SHA-256, so a client can tell whether
  // the stored key equals one it holds; empty when the keyring cannot read it.
  string fingerprint = 5;
}

message GetConfigRequest {}

message GetConfigResponse {
  repeated ModelSpec models = 1;
  repeated RuleSpec rules = 2;
  repeated VendorKeyInfo vendor_keys = 3;
  int64 version = 4;
  repeated UserRateLimitSpec user_rate_limits = 5;
  repeated SpendLimitSpec spend_limits = 6;
}

message MintAPIKeyRequest {
  string name = 1;
  repeated string scopes = 2; // "generate" | "admin" | "admin:read"
  string org_id = 3;
  string team_id = 4;
  APIKeyPolicy policy = 5;
}

// APIKeyPolicy limits one key on top of its team and each model's rpm. Refusals:
// PERMISSION_DENIED (model not allowed), RESOURCE_EXHAUSTED throttled:key_rpm |
// key_tpm, FAILED_PRECONDITION request_too_large (above a minute of tokens).
message APIKeyPolicy {
  repeated string allowed_models = 1; // model ids the key may call; empty = any
  int32 rpm_limit = 2; // calls per minute over all models, 0 = unlimited
  // Tokens per minute over all models, 0 = unlimited. A call books its input
  // estimate when admitted and its real input + output when it ends.
  int64 tpm_limit = 3;
}

// SetAPIKeyPolicy replaces a key's policy; it applies from the key's next call.
message SetAPIKeyPolicyRequest {
  string name = 1;
  APIKeyPolicy policy = 2;
}

message SetAPIKeyPolicyResponse {}

message MintAPIKeyResponse {
  string plain_key = 1; // returned exactly once, never stored or logged
}

message RevokeAPIKeyRequest {
  string name = 1;
}

message RevokeAPIKeyResponse {}

message ListAPIKeysRequest {}

message APIKeyInfo {
  string name = 1;
  repeated string scopes = 2;
  google.protobuf.Timestamp created_at = 3;
  bool disabled = 4;
  string org_id = 5;
  string team_id = 6;
  APIKeyPolicy policy = 7;
}

message ListAPIKeysResponse {
  repeated APIKeyInfo keys = 1;
}

message RotateEncryptionRequest {}

// RotateEncryption re-encrypts every vendor key and registered node auth token
// with the active keyring version; calling it again changes nothing. A vendor
// key encrypted with a version the keyring lacks fails it with
// FAILED_PRECONDITION and nothing changes. UNAVAILABLE after the vendor keys
// committed means only the node tokens are left: call it again.
message RotateEncryptionResponse {
  int32 reencrypted = 1; // vendor keys and node auth tokens re-encrypted
}

message MintNodeKeyRequest {
  string name = 1;
  string node_id = 2;
  repeated string allowed_cidrs = 3;
  repeated string allowed_models = 4;
  double max_base_weight = 5;
  int32 max_concurrency = 6;
}

message MintNodeKeyResponse {
  int64 id = 1;
  string plain_key = 2; // llm_node_... returned once
}

message RevokeNodeKeyRequest {
  int64 id = 1;
}

message RevokeNodeKeyResponse {}

message ListNodeKeysRequest {}

message NodeKeyInfo {
  int64 id = 1;
  string name = 2;
  string node_id = 3;
  google.protobuf.Timestamp created_at = 4;
  bool disabled = 5;
  repeated string allowed_cidrs = 6;
  repeated string allowed_models = 7;
  double max_base_weight = 8;
  int32 max_concurrency = 9;
}

message ListNodeKeysResponse {
  repeated NodeKeyInfo keys = 1;
}

message ListNodesRequest {}

message NodeInfo {
  string node_id = 1;
  string name = 2;
  string endpoint = 3;
  string state = 4; // HEALTHY | SUSPECT | DRAINING | PAUSED | CIRCUIT_BROKEN | OFFLINE
  repeated string models = 5;
  double effective_weight = 6;
  int32 active_requests = 7;
  int32 max_concurrent = 8;
  uint64 vram_free_mb = 9;
  uint64 vram_total_mb = 10;
  double ttft_ema_ms = 11;
  double tps_ema = 12;
  google.protobuf.Timestamp last_heartbeat = 13;
  double gpu_util_percent = 14;
  uint32 gpu_temp_c = 15;
  double base_weight = 16;
  string engine = 17;
  repeated string warm_models = 18;
  uint32 capacity_percent = 19; // current level of the node's schedule
  int32 effective_slots = 20; // concurrent requests allowed at that level
}

message ListNodesResponse {
  repeated NodeInfo nodes = 1;
}

message DrainNodeRequest {
  string node_id = 1;
}

message DrainNodeResponse {}

message UserRateLimitSpec {
  string user_id = 1; // user identity or "*" wildcard for default across users
  string model_id = 2; // target model id or "*" wildcard for default across models
  int32 rpm = 3; // requests per minute (0 = unlimited)
  int32 rpm_burst = 4; // extra burst allowed (0 = default burst of rpm - 1, <0 = burst disabled)
  int32 queue_timeout_ms = 5; // max wait in ms (0 = fallback immediately; capped to 250ms for interactive non-svc users)
  int64 daily_tokens = 6; // daily token budget per UTC day (0 = unlimited)
}

message SetUserRateLimitRequest {
  UserRateLimitSpec rate_limit = 1;
}

message SetUserRateLimitResponse {}

message DeleteUserRateLimitRequest {
  string user_id = 1;
  string model_id = 2;
}

message DeleteUserRateLimitResponse {}

message ListUserRateLimitsRequest {
  string user_id = 1; // optional filter
}

message ListUserRateLimitsResponse {
  repeated UserRateLimitSpec rate_limits = 1;
}

// SpendLimitSpec is a hard monetary cap across all models. Calls are priced
// from the model catalog; the worst case (input estimate plus max output) is
// reserved up front, and a request that would cross the cap is refused with
// throttled:spend_<subject>_<daily|monthly> (HTTP 429 insufficient_quota).
message SpendLimitSpec {
  // "key" (api key name) | "user" (attributes["user_id"] or svc:<key_name>).
  // Team caps ("team", monthly) are listed here but set only via Create/UpdateTeam.
  string subject_type = 1;
  string subject_id = 2; // key name / user id, or "*" for the default of that subject type
  string period = 3; // "day" | "month", UTC calendar periods
  int64 limit_nanousd = 4; // cap in nano-USD (1e-9 USD), > 0
}

message SetSpendLimitRequest {
  SpendLimitSpec spend_limit = 1;
}

message SetSpendLimitResponse {}

message DeleteSpendLimitRequest {
  string subject_type = 1;
  string subject_id = 2;
  string period = 3;
}

message DeleteSpendLimitResponse {}

message ListSpendLimitsRequest {
  string subject_type = 1; // optional filter
  string subject_id = 2; // optional filter
}

message ListSpendLimitsResponse {
  repeated SpendLimitSpec spend_limits = 1;
}

message Organization {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
}

// A team's keys may call only allowed_models (empty = any) and spend at most
// monthly_budget_usd per UTC month across all its keys (0 = no cap). Deleting a
// team or organization detaches revoked keys and is refused while active ones remain.
message Team {
  string id = 1;
  string org_id = 2;
  string name = 3;
  double monthly_budget_usd = 4;
  repeated string allowed_models = 5;
  google.protobuf.Timestamp created_at = 6;
}

message CreateOrganizationRequest {
  string name = 1;
}

message CreateOrganizationResponse {
  Organization organization = 1;
}

message ListOrganizationsRequest {}

message ListOrganizationsResponse {
  repeated Organization organizations = 1;
}

message DeleteOrganizationRequest {
  string id = 1;
}

message DeleteOrganizationResponse {}

message CreateTeamRequest {
  string org_id = 1;
  string name = 2;
  double monthly_budget_usd = 3;
  repeated string allowed_models = 4;
}

message CreateTeamResponse {
  Team team = 1;
}

message GetTeamRequest {
  string id = 1;
}

message GetTeamResponse {
  Team team = 1;
}

message ListTeamsRequest {
  string org_id = 1; // optional filter
}

message ListTeamsResponse {
  repeated Team teams = 1;
}

// Replaces the team: an omitted budget removes the cap and omitted
// allowed_models lifts the restriction, so send every field.
message UpdateTeamRequest {
  string id = 1;
  string name = 2;
  double monthly_budget_usd = 3;
  repeated string allowed_models = 4;
}

message UpdateTeamResponse {
  Team team = 1;
}

message DeleteTeamRequest {
  string id = 1;
}

message DeleteTeamResponse {}

message GetTeamSpendRequest {
  string id = 1;
}

// The team's spend this UTC month as the gateway enforces it (the same counter
// that refuses calls with throttled:spend_team_monthly). Only capped teams are
// counted, from the moment the budget was set.
message GetTeamSpendResponse {
  int64 spent_nanousd = 1;
  int64 limit_nanousd = 2; // 0 = no cap
  google.protobuf.Timestamp resets_at = 3;
  bool metered = 4; // false: no budget set, or no Redis (spend is not counted)
}

// GetSpend reports a key's, end user's or team's spend as the gateway enforces
// it: one window per spend limit period that applies to the subject.
message GetSpendRequest {
  string subject_type = 1; // "key" (subject_id = key name) | "user" | "team"
  string subject_id = 2;
}

message SpendWindow {
  string period = 1; // "day" | "month" (UTC)
  int64 spent_nanousd = 2;
  int64 limit_nanousd = 3; // 0 = no cap
  int64 remaining_nanousd = 4; // limit - spent, never below 0; 0 without a cap
  google.protobuf.Timestamp resets_at = 5;
  bool metered = 6; // false: no cap (spend is counted only under a cap), or no Redis
}

message GetSpendResponse {
  repeated SpendWindow windows = 1;
}

// Admin RPCs require the "admin" scope; the Get* and List* reads and
// ExplainRoute also accept "admin:read". Every config mutation validates the
// resulting full config in one transaction and bumps the config version.
service AdminService {
  rpc UpsertModel(UpsertModelRequest) returns (UpsertModelResponse);
  rpc DeleteModel(DeleteModelRequest) returns (DeleteModelResponse);
  rpc ReplaceRules(ReplaceRulesRequest) returns (ReplaceRulesResponse);
  rpc SetVendorKey(SetVendorKeyRequest) returns (SetVendorKeyResponse);
  rpc DeleteVendorKey(DeleteVendorKeyRequest) returns (DeleteVendorKeyResponse);
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc MintAPIKey(MintAPIKeyRequest) returns (MintAPIKeyResponse);
  rpc RevokeAPIKey(RevokeAPIKeyRequest) returns (RevokeAPIKeyResponse);
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);
  rpc SetAPIKeyPolicy(SetAPIKeyPolicyRequest) returns (SetAPIKeyPolicyResponse);
  rpc RotateEncryption(RotateEncryptionRequest) returns (RotateEncryptionResponse);
  rpc MintNodeKey(MintNodeKeyRequest) returns (MintNodeKeyResponse);
  rpc RevokeNodeKey(RevokeNodeKeyRequest) returns (RevokeNodeKeyResponse);
  rpc ListNodeKeys(ListNodeKeysRequest) returns (ListNodeKeysResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc DrainNode(DrainNodeRequest) returns (DrainNodeResponse);
  rpc SetUserRateLimit(SetUserRateLimitRequest) returns (SetUserRateLimitResponse);
  rpc DeleteUserRateLimit(DeleteUserRateLimitRequest) returns (DeleteUserRateLimitResponse);
  rpc ListUserRateLimits(ListUserRateLimitsRequest) returns (ListUserRateLimitsResponse);
  rpc SetSpendLimit(SetSpendLimitRequest) returns (SetSpendLimitResponse);
  rpc DeleteSpendLimit(DeleteSpendLimitRequest) returns (DeleteSpendLimitResponse);
  rpc ListSpendLimits(ListSpendLimitsRequest) returns (ListSpendLimitsResponse);

  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse);
  rpc DeleteOrganization(DeleteOrganizationRequest) returns (DeleteOrganizationResponse);
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse);
  rpc GetTeam(GetTeamRequest) returns (GetTeamResponse);
  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse);
  rpc UpdateTeam(UpdateTeamRequest) returns (UpdateTeamResponse);
  rpc DeleteTeam(DeleteTeamRequest) returns (DeleteTeamResponse);
  rpc GetTeamSpend(GetTeamSpendRequest) returns (GetTeamSpendResponse);
  rpc GetSpend(GetSpendRequest) returns (GetSpendResponse);

  // ExplainRoute dry-runs routing for a client key on the same code as
  // GenerateText: the rule a request would match and every model of its
  // chain, kept or dropped with the reason. It calls no vendor or judge and
  // spends no limit. A read, so admin:read is enough.
  rpc ExplainRoute(ExplainRouteRequest) returns (ExplainRouteResponse);
}

message ExplainRouteRequest {
  string api_key_name = 1; // the client key the request would carry
  Effort effort = 2; // as in GenerateTextRequest; with auto_route, the effort the judge would otherwise pick
  bool auto_route = 3; // as in GenerateTextRequest; without an effort the judge is not called (judge_skipped)
  map<string, string> attributes = 4; // request attributes the rules match on, user_id and canary_key included
  string placement = 5; // nodes_first | nodes_only | cloud_first | cloud_only, empty for the rule's default
  string model_override = 6; // as in GenerateTextRequest
  repeated string capabilities = 7; // capabilities the request needs, e.g. "google_search"
}

message RouteCandidate {
  string model_id = 1;
  string vendor = 2;
  // Empty when the model stays in the chain. Otherwise why it was dropped:
  // not_found (disabled or deleted), effort, capability, no_vendor_key,
  // key_policy, team_policy, placement, circuit_open, vendor_paused (see
  // paused_for), node_unavailable, node_pool_disabled. New reasons may appear.
  string dropped = 3;
  google.protobuf.Duration paused_for = 4; // vendor_paused: until the vendor's Retry-After ends
}

message ExplainRouteResponse {
  string rule = 1; // the matched rule; empty with model_override
  string effort = 2; // the effort matched on
  string route_mode = 3; // direct | override | auto-effort | auto-default, as X-KTMS-Route-Mode
  repeated string chain = 4; // the rule's chain after the canary draw
  repeated RouteCandidate candidates = 5; // every model of chain, in order
  repeated string models = 6; // what a call would try, in order: the kept candidates
  repeated int32 weights = 7; // the rule's canary weights over its use list; empty = none
  string shadow_model = 8; // mirrored model, if the rule mirrors and it is callable
  double shadow_percentage = 9;
  bool judge_skipped = 10; // auto_route without effort: a real call would ask the judge first
  // Set when a real call would fail before reaching a vendor: the gRPC code
  // and message it would return, e.g. "FAILED_PRECONDITION: no_vendor_key".
  string error = 11;
}
