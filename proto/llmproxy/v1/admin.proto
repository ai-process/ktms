syntax = "proto3";

package llmproxy.v1;

import "google/protobuf/timestamp.proto";
import "llmproxy/v1/llmproxy.proto";

option go_package = "github.com/ai-process/llm-proxy/gen/llmproxy/v1;llmproxyv1";

// ModelSpec is a registry entry. Vendor credentials are NOT part of the spec:
// they are per-client rows managed via SetVendorKey.
message ModelSpec {
  string id = 1; // unique registry id, referenced by rules and model_override
  string vendor = 2; // openai | anthropic | google | deepseek | ollama | local | typesafe | groq | mistral | azure | bedrock
  string endpoint = 3; // optional base-URL override
  repeated Effort efforts = 4; // tiers this model may serve
  repeated string capabilities = 5; // e.g. "google_search"
  int32 rpm = 6; // per client key per minute, 0 = unlimited
  double price_in_per_mtok = 7; // standard (off-peak) rate
  double price_out_per_mtok = 8;
  // Peak rates, 0 when the vendor bills one price all day. DeepSeek V4 doubles
  // for two windows daily, so a single price understates its cost.
  double price_in_peak_per_mtok = 12;
  double price_out_peak_per_mtok = 13;
  double price_in_batch_per_mtok = 14;
  double price_out_batch_per_mtok = 15;
  int64 daily_tokens_per_key = 9; // per api key per UTC day, 0 = unlimited
  int64 daily_tokens_per_user = 10; // per attributes["user_id"] (or svc:<key_name> fallback) per UTC day
  bool enabled = 11;
  int32 rpm_burst = 16; // extra burst allowed above steady-state rpm (0 = default burst of rpm - 1, <0 = burst disabled)
  int32 queue_timeout_ms = 17; // max wait for pool inference slot in ms (0 = fallback immediately; capped to 250ms for interactive non-svc users)
  double budget_grace_margin = 18; // allowed daily budget overdraft (0.0 = system default 0.05, <0.0 = disabled)
}

message RuleSpec {
  string name = 1; // unique, logged and put in usage meta
  int32 priority = 2; // unique; higher wins, first match takes the request
  Effort effort = 3; // EFFORT_UNSPECIFIED = matches any effort
  map<string, string> attributes = 4; // equality predicates over request attributes
  repeated string use = 5; // ordered fallback chain of model ids, cheaper-first
  bool enabled = 6;
  repeated int32 weights = 7; // traffic weights per model in use; empty means deterministic (100% on use[0])
  string shadow_model = 8; // optional model id for async traffic mirroring
  double shadow_percentage = 9; // percentage of requests to mirror (0.0 - 100.0)
}

message UpsertModelRequest {
  ModelSpec model = 1;
}

message UpsertModelResponse {}

message DeleteModelRequest {
  string id = 1;
}

message DeleteModelResponse {}

// ReplaceRules swaps the whole rule set transactionally. Rules change
// together; per-rule CRUD would deadlock on the catch-all validation.
message ReplaceRulesRequest {
  repeated RuleSpec rules = 1;
}

message ReplaceRulesResponse {}

message SetVendorKeyRequest {
  string api_key_name = 1; // client key this vendor credential is assigned to
  string vendor = 2;
  string plain_key = 3; // encrypted at rest; never stored, logged, or returned
}

message SetVendorKeyResponse {}

message DeleteVendorKeyRequest {
  string api_key_name = 1;
  string vendor = 2;
}

message DeleteVendorKeyResponse {}

message VendorKeyInfo {
  string api_key_name = 1;
  string vendor = 2;
  int32 key_version = 3; // keyring version used to encrypt
  google.protobuf.Timestamp created_at = 4;
}

message GetConfigRequest {}

message GetConfigResponse {
  repeated ModelSpec models = 1;
  repeated RuleSpec rules = 2;
  repeated VendorKeyInfo vendor_keys = 3;
  int64 version = 4;
  repeated UserRateLimitSpec user_rate_limits = 5;
  repeated SpendLimitSpec spend_limits = 6;
}

message MintAPIKeyRequest {
  string name = 1;
  repeated string scopes = 2; // "generate" | "admin"
}

message MintAPIKeyResponse {
  string plain_key = 1; // returned exactly once, never stored or logged
}

message RevokeAPIKeyRequest {
  string name = 1;
}

message RevokeAPIKeyResponse {}

message ListAPIKeysRequest {}

message APIKeyInfo {
  string name = 1;
  repeated string scopes = 2;
  google.protobuf.Timestamp created_at = 3;
  bool disabled = 4;
}

message ListAPIKeysResponse {
  repeated APIKeyInfo keys = 1;
}

message RotateEncryptionRequest {}

message RotateEncryptionResponse {
  int32 reencrypted = 1; // vendor keys re-encrypted with the active keyring version
}

message MintNodeKeyRequest {
  string name = 1;
  string node_id = 2;
  repeated string allowed_cidrs = 3;
  repeated string allowed_models = 4;
  double max_base_weight = 5;
  int32 max_concurrency = 6;
}

message MintNodeKeyResponse {
  int64 id = 1;
  string plain_key = 2; // llm_node_... returned once
}

message RevokeNodeKeyRequest {
  int64 id = 1;
}

message RevokeNodeKeyResponse {}

message ListNodeKeysRequest {}

message NodeKeyInfo {
  int64 id = 1;
  string name = 2;
  string node_id = 3;
  google.protobuf.Timestamp created_at = 4;
  bool disabled = 5;
  repeated string allowed_cidrs = 6;
  repeated string allowed_models = 7;
  double max_base_weight = 8;
  int32 max_concurrency = 9;
}

message ListNodeKeysResponse {
  repeated NodeKeyInfo keys = 1;
}

message ListNodesRequest {}

message NodeInfo {
  string node_id = 1;
  string name = 2;
  string endpoint = 3;
  string state = 4; // HEALTHY | SUSPECT | DRAINING | CIRCUIT_BROKEN | OFFLINE
  repeated string models = 5;
  double effective_weight = 6;
  int32 active_requests = 7;
  int32 max_concurrent = 8;
  uint64 vram_free_mb = 9;
  uint64 vram_total_mb = 10;
  double ttft_ema_ms = 11;
  double tps_ema = 12;
  google.protobuf.Timestamp last_heartbeat = 13;
  double gpu_util_percent = 14;
  uint32 gpu_temp_c = 15;
  double base_weight = 16;
  string engine = 17;
  repeated string warm_models = 18;
}

message ListNodesResponse {
  repeated NodeInfo nodes = 1;
}

message DrainNodeRequest {
  string node_id = 1;
}

message DrainNodeResponse {}

message UserRateLimitSpec {
  string user_id = 1; // user identity or "*" wildcard for default across users
  string model_id = 2; // target model id or "*" wildcard for default across models
  int32 rpm = 3; // requests per minute (0 = unlimited)
  int32 rpm_burst = 4; // extra burst allowed (0 = default burst of rpm - 1, <0 = burst disabled)
  int32 queue_timeout_ms = 5; // max wait in ms (0 = fallback immediately; capped to 250ms for interactive non-svc users)
  int64 daily_tokens = 6; // daily token budget per UTC day (0 = unlimited)
}

message SetUserRateLimitRequest {
  UserRateLimitSpec rate_limit = 1;
}

message SetUserRateLimitResponse {}

message DeleteUserRateLimitRequest {
  string user_id = 1;
  string model_id = 2;
}

message DeleteUserRateLimitResponse {}

message ListUserRateLimitsRequest {
  string user_id = 1; // optional filter
}

message ListUserRateLimitsResponse {
  repeated UserRateLimitSpec rate_limits = 1;
}

// SpendLimitSpec is a hard monetary cap across all models. Calls are priced
// from the model catalog; the worst case (input estimate plus max output) is
// reserved up front, and a request that would cross the cap is refused with
// throttled:spend_<subject>_<daily|monthly> (HTTP 429 insufficient_quota).
message SpendLimitSpec {
  string subject_type = 1; // "key" (api key name) | "user" (attributes["user_id"] or svc:<key_name>)
  string subject_id = 2; // key name / user id, or "*" for the default of that subject type
  string period = 3; // "day" | "month", UTC calendar periods
  int64 limit_nanousd = 4; // cap in nano-USD (1e-9 USD), > 0
}

message SetSpendLimitRequest {
  SpendLimitSpec spend_limit = 1;
}

message SetSpendLimitResponse {}

message DeleteSpendLimitRequest {
  string subject_type = 1;
  string subject_id = 2;
  string period = 3;
}

message DeleteSpendLimitResponse {}

message ListSpendLimitsRequest {
  string subject_type = 1; // optional filter
  string subject_id = 2; // optional filter
}

message ListSpendLimitsResponse {
  repeated SpendLimitSpec spend_limits = 1;
}

// All admin RPCs require the "admin" scope. Every config mutation validates
// the resulting full config in one transaction and bumps the config version.
service LLMProxyAdminService {
  rpc UpsertModel(UpsertModelRequest) returns (UpsertModelResponse);
  rpc DeleteModel(DeleteModelRequest) returns (DeleteModelResponse);
  rpc ReplaceRules(ReplaceRulesRequest) returns (ReplaceRulesResponse);
  rpc SetVendorKey(SetVendorKeyRequest) returns (SetVendorKeyResponse);
  rpc DeleteVendorKey(DeleteVendorKeyRequest) returns (DeleteVendorKeyResponse);
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc MintAPIKey(MintAPIKeyRequest) returns (MintAPIKeyResponse);
  rpc RevokeAPIKey(RevokeAPIKeyRequest) returns (RevokeAPIKeyResponse);
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);
  rpc RotateEncryption(RotateEncryptionRequest) returns (RotateEncryptionResponse);
  rpc MintNodeKey(MintNodeKeyRequest) returns (MintNodeKeyResponse);
  rpc RevokeNodeKey(RevokeNodeKeyRequest) returns (RevokeNodeKeyResponse);
  rpc ListNodeKeys(ListNodeKeysRequest) returns (ListNodeKeysResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc DrainNode(DrainNodeRequest) returns (DrainNodeResponse);
  rpc SetUserRateLimit(SetUserRateLimitRequest) returns (SetUserRateLimitResponse);
  rpc DeleteUserRateLimit(DeleteUserRateLimitRequest) returns (DeleteUserRateLimitResponse);
  rpc ListUserRateLimits(ListUserRateLimitsRequest) returns (ListUserRateLimitsResponse);
  rpc SetSpendLimit(SetSpendLimitRequest) returns (SetSpendLimitResponse);
  rpc DeleteSpendLimit(DeleteSpendLimitRequest) returns (DeleteSpendLimitResponse);
  rpc ListSpendLimits(ListSpendLimitsRequest) returns (ListSpendLimitsResponse);
}
