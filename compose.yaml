# Local stack: KTMS plus Postgres and Redis.
#
#   docker compose up -d
#
# With AUTO_SEED enabled (default), KTMS automatically seeds default models,
# rules, and the client key "ktms_dev_default_key" (or $SEED_CLIENT_KEY) with
# your OpenAI / Gemini / Anthropic API keys.
# gRPC: localhost:9090, HTTP / OpenAI API: localhost:8080.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ktms
      POSTGRES_PASSWORD: ktms
      POSTGRES_DB: ktms
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktms -d ktms"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"

  ktms:
    build:
      context: .
      target: audio
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://ktms:ktms@db:5432/ktms?sslmode=disable}"
      # Dev-only keyring; generate a real one for prod:
      #   echo "1:$(head -c 32 /dev/urandom | base64)"
      KTMS_ENCRYPTION_KEYS: "${KTMS_ENCRYPTION_KEYS:-${LLMPROXY_ENCRYPTION_KEYS:-1:LS1kZXYtb25seS1rZXktLWRldi1vbmx5LWtleS0tISE=}}"
      BOOTSTRAP_ADMIN_KEY: "${BOOTSTRAP_ADMIN_KEY:-dev-bootstrap}"
      REDIS_ADDR: redis:6379
      REDIS_KEY_PREFIX: dev
      AUTO_SEED: "${AUTO_SEED:-true}"
      SEED_CLIENT_KEY: "${SEED_CLIENT_KEY:-ktms_dev_default_key}"
      SEED_OPENAI_KEY: "${SEED_OPENAI_KEY:-${OPENAI_API_KEY:-}}"
      SEED_GEMINI_KEY: "${SEED_GEMINI_KEY:-${GEMINI_API_KEY:-}}"
      SEED_ANTHROPIC_KEY: "${SEED_ANTHROPIC_KEY:-${ANTHROPIC_API_KEY:-}}"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"

